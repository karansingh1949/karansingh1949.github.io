<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order | Tanisha Store</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(to right,#000,#1a1a1a);
color:white;
text-align:center;
}

header{
background:linear-gradient(90deg,black,gold);
padding:20px;
}

header h1{
color:gold;
margin:5px;
}

.track-box{
background:#111;
border:2px solid gold;
padding:30px;
margin:50px auto;
width:90%;
max-width:500px;
border-radius:20px;
box-shadow:0 0 20px gold;
}

input{
width:85%;
padding:12px;
margin:10px;
border-radius:10px;
border:none;
}

button{
background:#25D366;
color:white;
padding:12px 25px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:green;
}

.status{
margin-top:20px;
font-size:18px;
color:gold;
}

footer{
margin-top:50px;
padding:15px;
background:#111;
border-top:1px solid gold;
}
</style>
</head>

<body>

<header>
<h1>Track Your Order</h1>
<p>Tanisha Store | Fast & Secure Delivery</p>
</header>

<div class="track-box">

<h2 style="color:gold;">Enter Your Order ID 📦</h2>

<input type="text" id="orderId" placeholder="Enter Order ID">

<button onclick="trackOrder()">Check Status</button>

<div class="status" id="statusResult"></div>

</div>

<footer>
<p>© 2026 Tanisha Store | All Rights Reserved</p>
</footer>

<script>
function trackOrder(){
var id = document.getElementById("orderId").value;
var result = document.getElementById("statusResult");

if(id==""){
result.innerHTML="⚠ Please enter Order ID";
return;
}

if(id=="TS1001"){
result.innerHTML="✅ Order Confirmed";
}
else if(id=="TS1002"){
result.innerHTML="🚚 Order Shipped";
}
else if(id=="TS1003"){
result.innerHTML="📦 Out for Delivery";
}
else if(id=="TS1004"){
result.innerHTML="🎉 Order Delivered";
}
else{
result.innerHTML="❌ Invalid Order ID";
}
}
</script>

</body>
</html>
